
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">ShopEase 💗</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="checkout-section">
    <div class="checkout-container">

        <h1>Delivery Details 🌸</h1>
        <p>Please enter your details to deliver your order.</p>

        <div class="checkout-user" id="customerWelcome"></div>

        <form id="addressForm" class="address-form">

            <h2>Customer Information</h2>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required readonly>

            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone"
                placeholder="10-digit mobile number"
                pattern="[6-9][0-9]{9}" maxlength="10" required>

            <h2>Delivery Address</h2>

            <label for="house">House / Building Name</label>
            <input type="text" id="house" required>

            <label for="street">Street / Area</label>
            <input type="text" id="street" required>

            <label for="city">City</label>
            <input type="text" id="city" required>

            <label for="state">State</label>
            <input type="text" id="state" required>

            <label for="pincode">PIN Code</label>
            <input type="text" id="pincode"
                placeholder="6-digit PIN code"
                pattern="[0-9]{6}" maxlength="6" required>

            <label for="landmark">Landmark (Optional)</label>
            <input type="text" id="landmark"
                placeholder="Nearby landmark">

            <div class="checkout-summary">
                <h2>Order Summary 🛍️</h2>
                <div id="checkoutItems"></div>
                <h3>Total: ₹<span id="checkoutTotal">0</span></h3>
            </div>

            <button type="submit" class="place-order-btn">
                Place Order 💗
            </button>

            <p id="checkoutMessage"></p>

        </form>
    </div>
</section>

<footer>
    <p>© 2026 ShopEase. Made with 💗</p>
</footer>

<script>
const user = JSON.parse(
    localStorage.getItem("shopEaseCurrentUser") || "null"
);

if (!user) {
    window.location.href = "login.html";
}

const cart = JSON.parse(
    localStorage.getItem("shopEaseCart") || "[]"
);

const welcome = document.getElementById("customerWelcome");
const checkoutItems = document.getElementById("checkoutItems");
const checkoutTotal = document.getElementById("checkoutTotal");

if (user) {
    document.getElementById("fullName").value = user.name || "";
    document.getElementById("email").value = user.email || "";
    welcome.textContent = "Welcome, " + user.name + " 💗";
}

let total = 0;

if (cart.length === 0) {
    checkoutItems.textContent = "Your cart is empty.";
    document.querySelector(".place-order-btn").disabled = true;
} else {
    cart.forEach(item => {
        const lineTotal = Number(item.price) * Number(item.quantity);

        if (Number.isFinite(lineTotal) && lineTotal > 0) {
            total += lineTotal;

            const row = document.createElement("p");
            row.textContent =
                item.name + " × " + item.quantity + " = ₹" + lineTotal;

            checkoutItems.appendChild(row);
        }
    });

    checkoutTotal.textContent = total;
}

document.getElementById("addressForm").addEventListener("submit", function(event) {
    event.preventDefault();

    if (!user || cart.length === 0 || total <= 0) {
        return;
    }

    const order = {
        customer: {
            name: document.getElementById("fullName").value.trim(),
            email: user.email,
            phone: document.getElementById("phone").value.trim()
        },
        address: {
            house: document.getElementById("house").value.trim(),
            street: document.getElementById("street").value.trim(),
            city: document.getElementById("city").value.trim(),
            state: document.getElementById("state").value.trim(),
            pincode: document.getElementById("pincode").value.trim(),
            landmark: document.getElementById("landmark").value.trim()
        },
        items: cart,
        total: total,
        date: new Date().toISOString()
    };

    // Save all customer orders
    let orders = JSON.parse(
    localStorage.getItem("shopEaseOrders") || "[]"
    );

    orders.push(order);

    localStorage.setItem(
    "shopEaseOrders",
    JSON.stringify(orders)
   );

    // Also keep the latest order
     localStorage.setItem(
    "shopEaseLastOrder",
    JSON.stringify(order)
     );

    localStorage.removeItem("shopEaseCart");

    window.location.href = "order-success.html";
});
</script>

</body>
</html>
